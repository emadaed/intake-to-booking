# Reporting stack for the Intake-to-Booking project (local use only).
# SQLite (data/funnel.db) stays the operational database the API writes to.
# Postgres holds a reporting COPY that Metabase reads.
# Password comes from .env (git-ignored):  POSTGRES_PASSWORD=...

services:
  postgres:
    image: postgres:16-alpine
    container_name: itb-postgres
    environment:
      POSTGRES_USER: itb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: reporting
    ports:
      - "5433:5432"          # host 5433 -> container 5432 (avoids clashing with a local Postgres)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itb -d reporting"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: itb-metabase
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db   # Metabase's own settings, kept in a volume
    volumes:
      - metabase-data:/metabase-data

volumes:
  pgdata:
  metabase-data:
